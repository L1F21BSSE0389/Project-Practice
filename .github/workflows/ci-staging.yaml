name: workflow ci-staging
on:
  pull_request:
    branches:
      - "release/**"
jobs:
  ci-staging-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{github.ref}}
      - name: Lint html and css
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: build artifacts
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"